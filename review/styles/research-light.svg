<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#F7F7F4"/>
<text x="104" y="142.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="64.0" font-weight="700" fill="#202328" text-anchor="start">A useful system connects observation and action</text>
<ellipse cx="149.0" cy="269.0" rx="39.0" ry="39.0" fill="#F7F7F4" stroke="#34692E" stroke-width="6"/>
<text x="149.0" y="280.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#34692E" text-anchor="middle">1</text>
<text x="220" y="288.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#34692E" text-anchor="start">Observe the right signals</text>
<text x="266" y="360.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#34692E" text-anchor="start">Soil &amp; weather</text>
<text x="864" y="356.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#202328" text-anchor="start">Read measurements in their local context</text>
<ellipse cx="149.0" cy="432.24" rx="39.0" ry="39.0" fill="#F7F7F4" stroke="#235DA4" stroke-width="6"/>
<text x="149.0" y="443.24" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#235DA4" text-anchor="middle">2</text>
<text x="220" y="451.24" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#235DA4" text-anchor="start">Make the decision clear</text>
<text x="266" y="523.24" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#235DA4" text-anchor="start">Priorities</text>
<text x="864" y="519.24" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#202328" text-anchor="start">Explain what needs attention and why</text>
<ellipse cx="149.0" cy="595.48" rx="39.0" ry="39.0" fill="#F7F7F4" stroke="#995000" stroke-width="6"/>
<text x="149.0" y="606.48" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#995000" text-anchor="middle">3</text>
<text x="220" y="614.48" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#995000" text-anchor="start">Keep people in control</text>
<text x="266" y="686.48" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#995000" text-anchor="start">Feedback</text>
<text x="864" y="682.48" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#202328" text-anchor="start">Let gardeners confirm or revise the action</text>
<text x="1850" y="1033.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="28" font-weight="400" fill="#555D66" text-anchor="end">4</text>
</svg>