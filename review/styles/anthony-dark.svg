<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="100%" height="100%" fill="#2B2B2D"/>
<text x="104" y="142.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="64.0" font-weight="700" fill="#F6F6F4" text-anchor="start">A useful system connects observation and action</text>
<ellipse cx="149.0" cy="281.0" rx="39.0" ry="39.0" fill="#2B2B2D" stroke="#7ABC73" stroke-width="6"/>
<text x="149.0" y="292.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#7ABC73" text-anchor="middle">1</text>
<text x="220" y="300.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#7ABC73" text-anchor="start">Observe the right signals</text>
<text x="266" y="372.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#7ABC73" text-anchor="start">Soil &amp; weather</text>
<text x="864" y="371.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#F6F6F4" text-anchor="start">Read measurements in their local context</text>
<ellipse cx="149.0" cy="521.0" rx="39.0" ry="39.0" fill="#2B2B2D" stroke="#66A7FF" stroke-width="6"/>
<text x="149.0" y="532.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#66A7FF" text-anchor="middle">2</text>
<text x="220" y="540.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#66A7FF" text-anchor="start">Make the decision clear</text>
<text x="266" y="612.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#66A7FF" text-anchor="start">Priorities</text>
<text x="864" y="611.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#F6F6F4" text-anchor="start">Explain what needs attention and why</text>
<ellipse cx="149.0" cy="761.0" rx="39.0" ry="39.0" fill="#2B2B2D" stroke="#FFB253" stroke-width="6"/>
<text x="149.0" y="772.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="42.0" font-weight="700" fill="#FFB253" text-anchor="middle">3</text>
<text x="220" y="780.0" font-family="HelveticaNeue-Bold,Arial,sans-serif" font-size="62.0" font-weight="700" fill="#FFB253" text-anchor="start">Keep people in control</text>
<text x="266" y="852.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="42.0" font-weight="400" fill="#FFB253" text-anchor="start">Feedback</text>
<text x="864" y="851.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="38.0" font-weight="400" fill="#F6F6F4" text-anchor="start">Let gardeners confirm or revise the action</text>
<text x="1850" y="1033.0" font-family="HelveticaNeue,Arial,sans-serif" font-size="28.0" font-weight="400" fill="#BAC1CC" text-anchor="end">4</text>
</svg>